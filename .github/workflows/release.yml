# For each signed release tag: builds the app image and publishes it to GitHub's
# container registry, so installations download it instead of compiling for half
# an hour, then publishes the GitHub release with the changelog section and the
# browser extension attached. Each image is signed keylessly with this workflow's
# identity; the installer and `naruvi update` check that signature, and that it
# was made at the commit of the release tag, before running the image.
name: Release image
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
env:
  IMAGE: ghcr.io/eljakani/naruvi-app
jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          # Pushed by digest only; the merge job gives the multi-platform image its tags.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: false
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with this workflow's identity
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-platform image
        id: tag
        working-directory: /tmp/digests
        run: |
          version=${GITHUB_REF_NAME#v}
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE:$version ($digest)" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.3
      - name: Sign
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.tag.outputs.digest }}

  release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package the browser extension
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist/naruvi-extension
          cp -R extension/. dist/naruvi-extension/
          (cd dist && zip -qr "naruvi-extension-$version.zip" naruvi-extension)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md | sed '/./,$!d' > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/naruvi-extension-$version.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --latest "dist/naruvi-extension-$version.zip"
          fi
